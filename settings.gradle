pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        // mixinmcp_decompile
        maven { url = 'https://maven.muon.rip/releases' }
        maven { url = "https://mirrors.cloud.tencent.com/neoforge/releases" }
        maven { url = 'https://neoforged.forgecdn.net/releases' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = "https://maven.neoforged.net/releases" }
        maven { url = "https://maven.firstdark.dev/releases" }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

includeWildWindModule('the-wild-update')
includeWildWindModule('main')

def includeWildWindModule(String projectName, String moduleDirectory) {
    include(":${projectName}")
    project(":${projectName}").projectDir = file(moduleDirectory)
}

def includeWildWindModule(String projectName) {
    includeWildWindModule(projectName, 'modules/' + projectName)
}