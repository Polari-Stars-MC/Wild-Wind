plugins {
    id 'java-library'
    id 'maven-publish'
    alias(libs.plugins.moddev)
    alias(libs.plugins.mixinmcpdecompile)
    id 'idea'
}

ext.modId = rootProject.libs.versions.moduleId.get()
ext.modName = rootProject.libs.versions.moduleName.get()
ext.modVersion = rootProject.libs.versions.moduleVersion.get()
ext.modGroup = rootProject.libs.versions.moduleGroup.get()
ext.modDescription = rootProject.libs.versions.moduleDescription.get()

version = modVersion
group = modGroup
base.archivesName = modId

apply from: rootProject.file('build-conventions.gradle')

configureWrapper()
configureProjectIdentity(modVersion, modGroup)
configureBase(modId)
configureGeneratedResources('src/generated/resources')

dependencies {
    if (project.path != ':') {
        implementation project(':')
    }
}

sourceSets {
    main {
        java.srcDirs = ['src/java']
        resources.srcDirs = ['src/java/resources', 'src/generated/resources']
    }
}

configureNeoForge(modId)

configureModMetadata([
        minecraft_version      : rootProject.libs.versions.minecraft.get(),
        minecraft_version_range: rootProject.libs.versions.minecraftrange.get(),
        neo_version            : rootProject.libs.versions.neoforge.get(),
        mod_id                 : modId,
        mod_name               : modName,
        mod_license            : rootProject.libs.versions.modLicense.get(),
        mod_version            : modVersion,
        mod_description        : modDescription,
])

configurePublishing()
