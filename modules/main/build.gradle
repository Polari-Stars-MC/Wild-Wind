plugins {
    id 'java-library'
    id 'maven-publish'
    alias(libs.plugins.moddev)
    alias(libs.plugins.mixinmcpdecompile)
    id 'idea'
}

ext.modId = rootProject.libs.versions.mainId.get()
ext.modName = rootProject.libs.versions.mainName.get()
ext.modVersion = rootProject.libs.versions.mainVersion.get()
ext.modGroup = rootProject.libs.versions.mainGroup.get()
ext.modDescription = rootProject.libs.versions.mainDescription.get()

apply from: rootProject.file('build-conventions.gradle')

configureWrapper()
configureProjectIdentity(modVersion, modGroup)
configureBase(modId)
configureGeneratedResources('src/generated/resources')

dependencies {
    implementation project(':')
    rootProject.subprojects
            .findAll { it != project }
            .each { implementation it }
}

configureNeoForge(modId)

configureModMetadata([
        minecraft_version      : rootProject.libs.versions.minecraft.get(),
        minecraft_version_range: rootProject.libs.versions.minecraftrange.get(),
        neo_version            : rootProject.libs.versions.neoforge.get(),
        mod_id                 : modId,
        mod_name               : modName,
        mod_license            : rootProject.libs.versions.modLicense.get(),
        mod_version            : modVersion,
        mod_description        : modDescription,
])

configurePublishing()
